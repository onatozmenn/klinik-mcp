name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t klinik-mcp:ci .
      - name: Start container
        run: docker run -d --name klinik-mcp -p 8080:8080 klinik-mcp:ci
      - name: Wait for /health and check the MCP endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "ok"
          test "$(jq -r .tool_count /tmp/health.json)" -gt 0
          curl -fsS http://127.0.0.1:8080/.well-known/mcp/server-card.json | jq -e '.tools | length > 0'
      - name: Container logs
        if: always()
        run: docker logs klinik-mcp
      - name: Stop container
        if: always()
        run: docker rm -f klinik-mcp
